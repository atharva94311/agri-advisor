# Render Blueprint: one free web service built from the Dockerfile. Keys marked sync: false are asked for
# when the Blueprint is created and stored as secrets on Render, never in this repo.
services:
  - type: web
    name: agri-advisor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openai/gpt-4o
      - key: LLM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: MANDI_API_KEY
        sync: false
      - key: AGRI_CONTACT_EMAIL
        sync: false
